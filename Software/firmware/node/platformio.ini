[platformio]
default_envs = node
src_dir = main
boards_dir = ../boards

; One release profile: genuine identity, signed OTA, no hardware eFuse setup.
[env:node]
platform = espressif32 @ 7.0.1
framework = espidf
board = farmos-esp32-s3-n16r8
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts =
    pre:../../tools/platformio_firmware_config.py
    post:../../tools/platformio_upload.py
upload_protocol = custom
build_type = release
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;.pio/firmware-config/production/sdkconfig.defaults"
