[platformio]
default_envs = gateway_wroom
src_dir = main

[env:gateway_wroom]
platform = espressif32 @ 7.0.1
framework = espidf
board = esp32dev
board_build.flash_mode = dio
board_build.partitions = partitions.csv
monitor_speed = 115200
extra_scripts = pre:../../tools/platformio_firmware_config.py
build_type = release
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;.pio/firmware-config/production/sdkconfig.defaults"
