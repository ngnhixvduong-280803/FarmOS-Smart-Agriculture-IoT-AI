# Only key-authenticated operational and CI deployment accounts may use SSH.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers farmos-admin farmos-deploy
PermitUserEnvironment no
AllowAgentForwarding no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2
