# FarmOS production broker: keep plaintext traffic inside the Docker network only.
persistence true
persistence_location /mosquitto/data/
log_dest stdout

allow_anonymous false
password_file /mosquitto/config/password_file
acl_file /mosquitto/config/acl

# Internal application listener. It is never published on the VPS host.
listener 1883

# Remote gateways must use TLS on this listener.
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2
require_certificate false
