name: Package FarmOS Flasher

on:
  push:
    branches: [main]
    paths:
      - "desktop-flasher/**"
      - ".github/workflows/desktop-flasher-release.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: Native desktop platform to package
        required: true
        default: macos-latest
        type: choice
        options: [macos-latest, macos-13]

permissions:
  contents: read

# Isolated from ci-cd.yml: this packages only the desktop flasher and never
# compiles, uploads, or releases FarmOS firmware.
jobs:
  package:
    runs-on: ${{ inputs.platform || 'macos-latest' }}
    defaults:
      run:
        working-directory: desktop-flasher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-flasher/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Build standalone native esptool
        run: |
          python -m pip install --disable-pip-version-check esptool==4.11.0 pyinstaller
          pyinstaller --clean --noconfirm --onefile --collect-data esptool --name farmos-esptool tools/farmos_esptool.py
          pyi-archive_viewer -l dist/farmos-esptool | grep -q 'esptool/targets/stub_flasher/2/esp32s3.json'
          FARMOS_ESPTOOL_BIN="$PWD/dist/farmos-esptool" npm run prepare:tools
      - name: Build desktop installer
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          npm ci
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          npm run desktop:build
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: farmos-flasher-${{ runner.os }}-${{ runner.arch }}
          path: desktop-flasher/src-tauri/target/release/bundle/
          if-no-files-found: error
