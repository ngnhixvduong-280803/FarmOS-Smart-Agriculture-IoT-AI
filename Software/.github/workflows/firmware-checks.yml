name: Firmware tooling checks

on:
  pull_request:
    branches: [main]
    paths: ["firmware/**", "tools/**", ".github/workflows/firmware-checks.yml"]
  push:
    branches: [main]
    paths: ["firmware/**", "tools/**", ".github/workflows/firmware-checks.yml"]

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tools/manufacturing -p 'test_*.py'
      - run: python tools/build_firmware.py --help
